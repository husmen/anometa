[project]
name = "anometa"
version = "0.1.0"
description = "Few-shot industrial anomaly detection with TabPFN-3.5 on frozen vision-foundation-model features"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Anometa contributors" }]
requires-python = ">=3.14.2,<3.15"
dependencies = [
    "anomalib>=2.6.2",
    "matplotlib",
    "numpy",
    "optuna>=5.0.0",
    "pandas<=2.3.3",
    "pillow",
    "pyarrow<=25.0.1,!=25.0.0",
    "pydantic<=2.13.4",
    "pyyaml",
    "scikit-learn<=1.9.0",
    "scipy",
    "tabpfn>=9.0.0",
    "tabpfn-client>=0.6.0",
    "tabpfn-extensions[image]>=0.6.3",
    "timm>=1.0.30",
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=5.17.0",
]

[project.optional-dependencies]
gui = [
    "rerun-sdk>=0.38.1",
    "streamlit>=1.64.0",
]

[project.scripts]
anometa = "anometa.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs data/ad2 on disk",
    "models: needs HF or TabPFN model weights",
    "gpu: needs a CUDA device",
    "api: calls the Prior Labs TabPFN API",
]
addopts = "-m 'not data and not models and not gpu and not api'"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["docs/plans/PLAN_0.md", "docs/plans/PLAN_1_IMPLEMENTATION.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "D", "RUF", "PT", "NPY"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D100", "D104"]
"src/anometa/metrics/_pro_reference.py" = ["ANN", "D", "B", "SIM", "UP", "NPY"]

[tool.pyrefly]
preset = "strict"
python-version = "3.14"
project-includes = ["src", "tests"]

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[[tool.pyrefly.sub-config]]
matches = "src/anometa/metrics/_pro_reference.py"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[dependency-groups]
dev = [
    "pandas-stubs~=2.3.0",
    "pre-commit>=4.6.2",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "scipy-stubs>=1.18.1.1",
    "types-pyyaml>=6.0.12.20260906",
]
